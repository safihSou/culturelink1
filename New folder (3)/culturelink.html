html{scroll-padding-top:env(safe-area-inset-top,0px)}

h1,h2,h3,.serif{font-family:"Playfair Display","Noto Serif SC",Georgia,serif;margin:0 0 .4em}
button,select,input,textarea{font:inherit;color:inherit}
.btn{background:var(--jade);color:#fff;border:0;border-radius:10px;padding:.6em 1.1em;cursor:pointer;font-weight:600}
.btn.alt{background:transparent;color:var(--fg);border:1.5px solid var(--jade)}
.btn.ver{background:var(--ver)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

nav.top{display:flex;gap:4px;margin-left:auto}
nav a{color:inherit;text-decoration:none;padding:6px 10px;border-radius:8px;font-size:.92rem}

nav.bot{display:none}

main{max-width:1000px;margin:0 auto;padding:20px 16px}

.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.hero{text-align:center;padding:40px 0 20px}

.stamp{position:relative;text-align:center;cursor:pointer;background:var(--card);border:2px dashed var(--bd);border-radius:14px;padding:14px 8px;width:100%}
.stamp .em{font-size:2.4rem}

.stamp.visited{border:2px solid var(--ver);border-style:solid;transform:rotate(-1.5deg)}

.bar{height:10px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.tag{display:inline-block;font-size:.75rem;border-radius:20px;padding:2px 9px;background:var(--bd);margin:2px 2px 0 0}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:grid;place-items:center;padding:14px}
.md{background:var(--bg);border-radius:16px;max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:20px;border:2px solid var(--gold)}

.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--jade);background:none;border-radius:20px;padding:.3em 1em;cursor:pointer}
.tabs button.on{background:var(--jade);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:.6em .8em;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);cursor:pointer}

.tree-result.ok{color:#1b8a4b;font-weight:700}.tree-result.no{color:var(--ver);font-weight:700}

.thunk{animation:thunk .6s cubic-bezier(.2,1.6,.4,1)}

.spin{width:36px;height:36px;border:4px solid var(--bd);border-top-color:var(--jade);border-radius:50%;animation:s 1s linear infinite;margin:20px auto}
@keyframes s{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.book{max-width:400px;margin:0 auto}
.sw{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:8px 16px 16px 8px;box-shadow:0 16px 36px rgba(0,0,0,.35);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sw::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:3/4;position:relative;padding:20px 18px 24px 28px;color:#2a2a22;background:repeating-linear-gradient(0deg,rgba(15,81,50,.05) 0 2px,transparent 2px 5px),linear-gradient(90deg,rgba(0,0,0,.2),transparent 8%),#f7f0dd;display:flex;flex-direction:column;overflow:hidden}
.pg.cv{background:radial-gradient(circle at 50% 40%,#16a58f,#0E8574 60%,#0a6558);color:#F2B705;align-items:center;justify-content:center;text-align:center;cursor:pointer;border:0;font:inherit}
.pg.cv img{width:96px;height:96px;object-fit:contain;display:block}
.pg h4{font:700 .78rem "Playfair Display",serif;letter-spacing:.14em;text-transform:uppercase;color:#0E8574;border-bottom:1.5px solid #0E8574;padding-bottom:6px;margin:0 0 10px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}
.st{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#2a2a22;text-align:center;padding:2px;font:inherit}
.ring{width:min(30vw,104px);aspect-ratio:1;border-radius:50%;border:4px double #E8503A;display:grid;place-items:center;font-size:2.4rem;color:#E8503A;transform:rotate(var(--r,0deg));margin-bottom:4px;mix-blend-mode:multiply;overflow:hidden}
.ring img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.st.locked .ring{border:2px dashed #b9ad92;filter:grayscale(1);opacity:.55;color:#8a8266}
.st.mastered .ring{border-color:#F2B705;color:#a07f10;box-shadow:inset 0 0 0 3px rgba(201,162,39,.4)}
.st small{font-size:.68rem;color:#6b6450;line-height:1.2}
.pgn{position:absolute;bottom:6px;right:14px;font-size:.7rem;color:#8a8266}
.fld{font-size:.62rem;color:#6b6450;letter-spacing:.08em;text-transform:uppercase}
.fv{font:600 1rem "Playfair Display",Georgia,serif;margin-bottom:8px}
.mrz{font:.72rem/1.3 ui-monospace,monospace;letter-spacing:.06em;color:#333;word-break:break-all;margin-top:auto}
.dots{display:flex;justify-content:center;gap:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}
.dots i.on{background:var(--ver)}
.pg.cv.imp{background:radial-gradient(circle at 50% 40%,#2a2a2a,#111 60%,#000);color:#C9A227}
.trunk{border-left:3px solid var(--jade);margin:10px 0 10px 12px;padding-left:16px}
.tn{opacity:0;transform:translateY(28px);transition:opacity .7s,transform .7s;margin:14px 0}
.tn.in{opacity:1;transform:none}
details.tn{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}
summary{cursor:pointer}
.env{text-align:center;cursor:pointer;width:100%;transition:transform .3s;position:relative;overflow:hidden;padding:0}
.env .envimg{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:12px 12px 0 0;background:var(--bd)}
.env .envbody{padding:10px 12px 14px}
.env:hover{transform:rotate(-2deg) scale(1.03)}
.env::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50%;background:linear-gradient(to bottom,transparent,rgba(242,183,5,.12));pointer-events:none}
.env-open{animation:envOpen .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes envOpen{0%{transform:scale(1) rotate(0deg)}30%{transform:scale(1.08) rotate(-3deg)}60%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1) rotate(0deg);opacity:0}}
.paper{background:repeating-linear-gradient(#fff8d6 0 27px,#e8dca8 27px 28px);color:#2a2a22;padding:14px;border-radius:8px;min-height:100px;white-space:pre-wrap}
.paper img,.md img{max-width:100%;border-radius:6px;margin:6px 0}
.banner{width:100%;aspect-ratio:3/1;object-fit:cover;border-radius:14px;display:block;margin-bottom:14px;background:var(--bd)}
.cardimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;margin-bottom:10px;background:var(--bd)}
.logo img{display:block;object-fit:contain;border-radius:6px;max-width:100%;height:auto}

/* ============================================================
   CULTURELINK — MODERN VISUAL REFINEMENT
   Presentation-only overrides: existing routes and behavior stay intact.
   ============================================================ */
:root{
  --bg:#f5f7f4;--fg:#182b27;--card:#ffffff;--jade:#176b5b;
  --ver:#c65c49;--gold:#d6a943;--mut:#687a73;--bd:#dce6e0;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101b18;--fg:#edf4ef;--card:#192722;--jade:#278b76;
  --ver:#df7864;--gold:#d6b45f;--mut:#a8bbb1;--bd:#30443b;
  color-scheme:dark;
}
html{scroll-behavior:smooth}
body{font-family:Inter,"Noto Sans SC",system-ui,sans-serif;line-height:1.6;letter-spacing:.005em}
body::before{opacity:.28}
header{background:rgba(23,107,91,.97);backdrop-filter:blur(14px);box-shadow:0 4px 22px rgba(18,48,39,.12);padding-left:clamp(16px,3vw,34px);padding-right:clamp(16px,3vw,34px)}
.logo{font-size:1.18rem;letter-spacing:-.025em;gap:10px}
.logo img{border-radius:10px!important}
nav.top{gap:5px}
nav a{font-weight:550;transition:background .18s ease,transform .18s ease}
nav a:hover{background:rgba(255,255,255,.14);transform:translateY(-1px)}

.thm,header select{backdrop-filter:blur(8px);transition:background .18s ease}
.thm:hover,header select:hover{background:rgba(255,255,255,.27)}
main{max-width:1160px;padding:clamp(22px,4vw,42px) clamp(16px,3vw,30px)}
h1,h2,h3,.serif{letter-spacing:-.025em;line-height:1.2}
h2{font-size:clamp(1.45rem,3vw,2rem)}
h3{font-size:1.12rem}
p{margin-top:.45em}
.card{border:1px solid var(--bd);border-radius:18px;padding:clamp(16px,2vw,22px);box-shadow:0 5px 20px rgba(27,57,44,.045);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(27,57,44,.09);border-color:color-mix(in srgb,var(--jade) 35%,var(--bd))}
.grid{gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.hero{padding:clamp(34px,6vw,66px) 0 28px}
.hero>img{filter:drop-shadow(0 8px 14px rgba(23,107,91,.12));margin-bottom:12px}
.hero h1{max-width:850px;margin:12px auto;color:var(--jade);font-size:clamp(2.1rem,6vw,3.8rem);letter-spacing:-.045em}
.hero>p{font-size:1.05rem;color:var(--mut);line-height:1.75}
.btn{border-radius:11px;padding:.68em 1.2em;box-shadow:0 3px 9px rgba(18,65,52,.12);transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.04);box-shadow:0 6px 15px rgba(18,65,52,.16)}
.btn:active:not(:disabled){transform:translateY(0)}
.btn.alt{box-shadow:none}
input,select,textarea{border-radius:11px;padding:.68em .8em;min-height:42px;transition:border-color .18s ease,box-shadow .18s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--jade);box-shadow:0 0 0 3px color-mix(in srgb,var(--jade) 15%,transparent)}
label{font-weight:600;font-size:.92rem}
.note{line-height:1.5}
.tag{padding:3px 10px;font-weight:550}
.banner,.cardimg,.env .envimg{border-radius:13px}
.cardimg{margin-bottom:13px}
.pp{border:1px solid rgba(214,169,67,.75);border-radius:20px;background:linear-gradient(125deg,#176b5b,#124e44);box-shadow:0 12px 28px rgba(18,65,52,.16);padding:22px 24px}
.av{box-shadow:inset 0 0 0 4px rgba(255,255,255,.2)}
.stamp{border-radius:16px;transition:transform .18s ease,box-shadow .18s ease}

.stamp.visited{transform:none;border-color:var(--ver)}
.stamp.mastered{box-shadow:0 0 0 3px rgba(214,169,67,.18)}

.tabs button:hover,.opt:hover:not(:disabled){transform:translateY(-1px);border-color:var(--jade)}
.opt{border-radius:12px;padding:.72em .9em}
.md{border:1px solid var(--bd);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.24);padding:clamp(18px,4vw,28px)}
.ov{backdrop-filter:blur(5px)}
footer{padding:24px 16px 30px;line-height:1.7}

.env{border-radius:14px;background:var(--card);border:1px solid var(--bd);box-shadow:0 5px 18px rgba(27,57,44,.05);transition:transform .2s ease,box-shadow .2s ease}

.x-eyebrow{display:block;text-align:center;font-size:.76rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ver);margin-bottom:8px}
.x-lead{text-align:center;max-width:640px;margin:0 auto 28px;color:var(--mut)}
.x-stats{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;box-shadow:0 5px 20px rgba(27,57,44,.045)}
.x-stat{padding:24px 10px;text-align:center;border-right:1px solid var(--bd)}
.x-stat:last-child{border-right:0}
.x-stat b{display:block;font:700 clamp(1.8rem,4vw,2.6rem)/1.1 "Playfair Display","Noto Serif SC",Georgia,serif;color:var(--jade)}
.x-stat span{font-size:.84rem;color:var(--mut)}
@media(max-width:640px){.x-stats{grid-template-columns:1fr 1fr}.x-stat:nth-child(2){border-right:0}.x-stat:nth-child(-n+2){border-bottom:1px solid var(--bd)}}
.x-steps{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));counter-reset:xs}
.x-step{position:relative;padding-top:32px}
.x-step::before{counter-increment:xs;content:counter(xs);position:absolute;top:-16px;left:20px;width:34px;height:34px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 4px 10px rgba(18,65,52,.22)}
.x-ic{font-size:1.9rem;line-height:1;margin-bottom:8px}
.x-band{position:relative;border-radius:22px;overflow:hidden;color:#fff;padding:clamp(28px,6vw,58px);background:#124e44 center/cover no-repeat}
.x-band::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(10,52,44,.94),rgba(10,52,44,.55))}
.x-band>*{position:relative}
.x-band h2{color:#fff;text-align:left;margin-bottom:.4em}
.x-band p{max-width:560px;color:#e6f0ea}
.x-band .row{margin-top:18px}
.x-faq details{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 0;transition:border-color .2s,box-shadow .2s}
.x-faq summary{padding:15px 18px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.x-faq summary::-webkit-details-marker{display:none}
.x-faq summary::after{content:"+";color:var(--jade);font-size:1.4rem;line-height:1;flex:none}
.x-faq details[open]{border-color:var(--jade);box-shadow:0 6px 18px rgba(27,57,44,.06)}
.x-faq details[open] summary::after{content:"\2013"}
.x-faq details p{margin:0;padding:0 18px 16px;color:var(--mut)}
.x-narrow{max-width:760px;margin-left:auto;margin-right:auto}
.x-ph{text-align:center;padding:clamp(28px,6vw,58px) 0 6px}
.x-ph h1{color:var(--jade);font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-.04em;margin-bottom:.25em}
.x-ph p{max-width:640px;margin:0 auto;color:var(--mut);font-size:1.05rem}
.x-two{display:grid;gap:22px;grid-template-columns:1.3fr 1fr;align-items:start}
@media(max-width:760px){.x-two{grid-template-columns:1fr}}
.x-list{margin:.6em 0 0;padding-left:1.1em}
.x-list li{margin:.35em 0}
.x-legal h3{margin-top:1.4em}
.x-legal p,.x-legal li{color:var(--mut)}
.x-ok{display:none;margin-top:10px;color:#1b8a4b;font-weight:600}
.x-ft{display:grid;gap:26px;grid-template-columns:1.5fr repeat(3,1fr);text-align:left;max-width:1160px;margin:0 auto 18px;padding:34px clamp(4px,2vw,18px) 24px;border-bottom:1px solid var(--bd);font-size:.9rem}
.x-ft .x-brand{display:flex;align-items:center;gap:10px;font:700 1.15rem "Playfair Display",Georgia,serif;color:var(--fg);margin-bottom:8px}
.x-ft p{color:var(--mut);margin:0;max-width:300px;line-height:1.6}
.x-ft h4{margin:0 0 8px;font:700 .74rem Inter,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--fg)}
.x-ft a{display:block;color:var(--mut);text-decoration:none;padding:4px 0}
.x-ft a:hover{color:var(--jade);text-decoration:underline}
@media(max-width:700px){.x-ft{grid-template-columns:1fr 1fr}.x-ft>div:first-child{grid-column:1/-1}}
.x-top{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:6;width:44px;height:44px;border-radius:50%;border:0;background:var(--jade);color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:0 8px 20px rgba(18,65,52,.3);opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .2s,transform .2s}
.x-top.show{opacity:1;pointer-events:auto;transform:none}
@media(max-width:760px){.x-top{bottom:calc(82px + env(safe-area-inset-bottom,0px))}}
.x-rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.x-rv.in{opacity:1;transform:none}

function uploadLogo(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*k;c.height=im.height*k;
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      const data=c.toDataURL('image/png');
      try{localStorage.setItem('cl-avatar',data)}catch(e){}
      AVATAR_URL=data;
      render()
    };
    im.src=r.result
  };
  r.readAsDataURL(f)
}

function tqSelect(b){
  const group=b.closest('.tree-q');
  if(!group||group.dataset.submitted==='1')return;
  group.querySelectorAll('button.opt').forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});
  b.classList.add('selected');b.setAttribute('aria-pressed','true');
  group.querySelector('.tree-submit').disabled=false;
}
function tqSubmit(b){
  const group=b.closest('.tree-q');
  if(!group||group.dataset.submitted==='1')return;
  const selected=group.querySelector('button.opt.selected');
  if(!selected)return;
  const correct=selected.dataset.ok==='1';
  group.dataset.submitted='1';
  group.querySelectorAll('button.opt').forEach(x=>{
    x.disabled=true;
    if(x.dataset.ok==='1')x.classList.add('ok');
    else if(x===selected)x.classList.add('no');
  });
  b.disabled=true;
  const result=group.querySelector('.tree-result');
  result.textContent=correct?'✓ '+t('treeCorrect'):'✕ '+t('treeIncorrect');
  result.classList.toggle('ok',correct);
  result.classList.toggle('no',!correct);
}

function pics(inp,cb){
  const out=[];let n=inp.files.length;
  if(!n)return cb([]);
  [...inp.files].forEach(f=>{
    const r=new FileReader();
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=im.width*k;c.height=im.height*k;
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        out.push(c.toDataURL('image/jpeg',.8));
        if(!--n)cb(out)
      };
      im.onerror=()=>{if(!--n)cb(out)};
      im.src=r.result
    };
    r.readAsDataURL(f)
  })
}

    <p>${L('Your name, email, home city, travel style, stamps, points, saved trips, posts and preferences are saved in your browser’s local storage on this device. This prototype makes no network requests, so nothing is sent to a server.','你的姓名、電郵、居住城市、旅遊方式、印章、積分、已儲存行程、貼文及偏好設定，均儲存在這部裝置瀏覽器的本機儲存空間。此原型不會發出任何網絡請求，因此不會傳送任何資料至伺服器。','你的姓名、电邮、居住城市、旅游方式、印章、积分、已保存行程、帖子及偏好设置，均存储在这台设备浏览器的本地存储空间。此原型不会发出任何网络请求，因此不会传送任何资料至服务器。')}</p>
    <h3>${L('Microphone','麥克風','麦克风')}</h3>
    <p>${L('The microphone is used only if you choose to record a voice message, and your browser will ask for permission first.','只有在你選擇錄製語音訊息時才會使用麥克風，瀏覽器會先請求你的許可。','只有在你选择录制语音消息时才会使用麦克风，浏览器会先请求你的许可。')}</p>
    <h3>${L('Your control','你的控制權','你的控制权')}</h3>
    <p>${L('Clearing your browser’s site data for this page removes everything the prototype has saved.','清除此頁面的瀏覽器網站資料，即可移除原型保存的所有內容。','清除此页面的浏览器网站数据，即可移除原型保存的所有内容。')}</p>
    <h3>${L('Using the prototype','使用原型','使用原型')}</h3>
    <p>${L('Please respect local rules and other visitors when using the companion board. Content and venue details shown are for demonstration and may not reflect current opening hours or prices.','使用旅伴板時，請尊重當地規定及其他旅客。所示內容及場地資料僅供示範，可能與現時開放時間或價格不符。','使用旅伴板时，请尊重当地规定及其他旅客。所示内容及场地资料仅供示范，可能与现时开放时间或价格不符。')}</p>
  </div></section>`
};
const TITLES={about:['About','關於','关于'],faq:['FAQ','常見問題','常见问题'],contact:['Contact','聯絡我們','联络我们'],privacy:['Privacy & Terms','私隱及條款','隐私及条款']};

window.xSend=function(e){
  e.preventDefault();
  const n=document.getElementById('xc-n'),m=document.getElementById('xc-m'),em=document.getElementById('xc-e'),ok=document.getElementById('xc-ok');
  const valid=n.value.trim()&&/^\S+@\S+\.\S+$/.test(em.value.trim())&&m.value.trim();
  ok.style.display='block';
  if(!valid){ok.style.color='var(--ver)';ok.textContent=L('Please complete your name, a valid email and a message.','請填寫姓名、有效電郵及訊息。','请填写姓名、有效电邮及消息。');return}
  ok.style.color='#1b8a4b';
  ok.textContent=L('Thank you! This is a prototype, so your message was not actually sent.','多謝你！此為原型，訊息並未實際傳送。','谢谢你！此为原型，消息并未实际发送。');
  e.target.reset();
};

/* ---------- footer, public nav, extras ---------- */
function richFooter(orig){
  const u=U();
  const lk=(h,tx)=>`<a href="${h}">${tx}</a>`;
  return `<div class="x-ft">
    <div><div class="x-brand">${logo(30)}<span>CultureLink</span></div><p>${L('A playful travel journal for Hong Kong and Macau visitors exploring Jiangsu.','為探索江蘇的香港及澳門旅客而設的遊戲式旅遊日誌。','为探索江苏的香港及澳门旅客而设的游戏式旅游日志。')}</p></div>
    <div><h4>${L('Explore','探索','探索')}</h4>${lk('culture-tree.html',L('Culture Tree','文化樹','文化树'))}${u?lk('#passport',t('passport'))+lk('#explore',t('explore')):lk('#login',t('signin'))+lk('#signup',t('create'))}</div>
    <div><h4>${L('Company','關於我們','关于我们')}</h4>${lk('#about',L('About','關於','关于'))}${lk('#faq',L('FAQ','常見問題','常见问题'))}${lk('#contact',L('Contact','聯絡我們','联络我们'))}</div>
    <div><h4>${L('Legal','法律','法律')}</h4>${lk('#privacy',L('Privacy & Terms','私隱及條款','隐私及条款'))}</div>
  </div><div>${orig}</div>`;
}
function publicNav(r){
  if(U())return;
  const sp=document.querySelector('#hd .sp');
  if(!sp)return;
  sp.outerHTML=`<nav class="top x-pub" aria-label="Site">${PUBLIC.filter(k=>k!=='privacy').map(k=>`<a href="#${k}" class="${r===k?'on':''}">${TITLES[k][S.locale]}</a>`).join('')}<a href="culture-tree.html">${L('Culture Tree','文化樹','文化树')}</a></nav>`;
}
let io=null;
function reveal(){
  const els=document.querySelectorAll('.x-rv:not(.in)');
  if(!('IntersectionObserver' in window)){els.forEach(e=>e.classList.add('in'));return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}}),{threshold:.08});
  els.forEach(e=>io.observe(e));
}

/* ---------- render wrapper ---------- */
const baseRender=render;let lastR=null;
render=function(){
  const r=route(),isNew=PUBLIC.includes(r);
  if(isNew){
    header();
    document.getElementById('app').innerHTML=PAGES[r]();
    document.documentElement.lang=LG[S.locale];
    document.title=TITLES[r][S.locale]+' | CultureLink';
  }else{
    baseRender();
    document.title='CultureLink';
    if(r==='tree')return;
  }
  publicNav(r);
  const f=ft();if(f&&!f.querySelector('.x-ft'))f.innerHTML=richFooter(f.innerHTML);
  if(r!==lastR&&(isNew||PUBLIC.includes(lastR)))window.scrollTo(0,0);
  lastR=r;
  reveal();
};

/* ---------- back to top ---------- */
const topBtn=document.createElement('button');
topBtn.className='x-top';topBtn.type='button';topBtn.textContent='↑';
topBtn.setAttribute('aria-label','Back to top');
topBtn.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
document.body.appendChild(topBtn);
addEventListener('scroll',()=>topBtn.classList.toggle('show',window.scrollY>700),{passive:true});

render();
})();
</script>
